# fly-chess v3 recipe: the fly SEES the board through its photoreceptors (plus the sensory path), homeostatic
# gains, multi-timestep readout, neuromodulatory gating, central-brain readout, human + engine-evaluated data.
#   scripts/train-supervised.sh fly3 --stage imitation --config configs/v3.yaml
run: fly3
graph: full
brain:
  steps: 16                    # 16 synaptic hops from the sensory neurons to the descending neurons (v1: 8)
  alpha: 0.5
  activation: satrelu          # sat * tanh(relu(x) / sat): rates saturate instead of drifting upward
  sat: 10.0
  input_dim: 1280
  num_moves: 4168
  weight_init_scale: 1.0
  dale: true
  dtype: float32
  value_hidden: 256
  vision: true                 # board -> retina (6k photoreceptors, left eye files a-d, right eye e-h)
  sensory_input: true          # keep the dense projection into sensory/ascending neurons too
  readout_steps: [8, 16]       # heads read the descending neurons at two timesteps
  neuromod: true               # DA/SER/OCT synapses gate multiplicatively
  central_dim: 128             # compressed readout of the 32k central-brain neurons
  homeostatic: true            # per-neuron gains calibrated on data at init (visual pathway needs it)

shards_dir: data/shards
shard_name: lichess2014,lichess2015,evals:2   # human games + Stockfish-evaluated positions (oversampled 2x)
val_fraction: 0.02

batch_size: 384                # 16 steps x 384 fits the 16 GB card without gradient checkpointing
lr: 0.0006
weight_decay: 0.0001
warmup_steps: 1500
epochs: 1
max_steps: 260000              # ~100M positions, ~17 h on an RTX 5080 with the fused/reordered kernels
value_loss_weight: 1.0
grad_clip: 1.0
amp: false                     # bf16 autocast corrupts the loss as activity grows (measured on v1)
grad_checkpoint: false

log_every: 20
eval_every: 2000
eval_batches: 50
checkpoint_every: 4000
elo_every: 20000
elo_games: 20
num_workers: 12
seed: 1
device: cuda

selfplay_iters: 50
selfplay_games_per_iter: 512   # v2: games per iteration, always generated by the best network (v1: 64)
mcts_sims: 100                 # simulations per move in self-play (v1: 64)
c_puct: 1.5
temperature_plies: 30
dirichlet_alpha: 0.3
dirichlet_eps: 0.25
replay_buffer_size: 200000
selfplay_batch_size: 384
selfplay_train_steps_per_iter: 400
selfplay_lr: 0.0001            # v1's 2e-4 on self-play targets alone forgot the human data
max_game_plies: 300
selfplay_workers: 1
selfplay_lockstep_games: 512   # games searched in one lockstep batch; more games run as several batches
selfplay_eval_every_iters: 5      # Elo vs random (and vs the previous iteration without a gate) every N iterations
selfplay_human_mix: 0.5           # half of every training batch streams from the imitation shards (rehearsal)
selfplay_value_blend: 0.5         # value target = 0.5 * game outcome + 0.5 * root search value
selfplay_gate: true               # promote the candidate only if it beats the best network with superfly
selfplay_gate_games: 40           # gate match games (paired distinct openings, both colours)
selfplay_gate_sims: 100           # MCTS simulations per move in the gate match
selfplay_gate_threshold: 0.51      # promote only with a net positive score over the 40-game gate (0.55 rejected coin-flip candidates)
