# Smoke-test config (== TrainConfig.tiny()): the 2000-neuron `tiny` graph, 30 steps, everything small.
#   fly train --run tiny --config configs/tiny.yaml --stage imitation
run: tiny
graph: tiny                    # data/brain/tiny.npz
brain:
  steps: 4
  alpha: 0.5
  activation: relu
  input_dim: 1280
  num_moves: 4168
  weight_init_scale: 1.0
  dale: true
  dtype: float32
  value_hidden: 32

shards_dir: data/shards
shard_name: null               # any shard in shards_dir
val_fraction: 0.2

batch_size: 32
lr: 0.001
weight_decay: 0.0001
warmup_steps: 5
epochs: 1
max_steps: 30
value_loss_weight: 1.0
grad_clip: 1.0
amp: false
grad_checkpoint: false

log_every: 5
eval_every: 10
eval_batches: 2
checkpoint_every: 20
elo_every: 20
elo_games: 2
num_workers: 0
seed: 0
device: cuda

selfplay_iters: 1
selfplay_games_per_iter: 2
mcts_sims: 4
c_puct: 1.5
temperature_plies: 30
dirichlet_alpha: 0.3
dirichlet_eps: 0.25
replay_buffer_size: 1000
selfplay_batch_size: 16
selfplay_train_steps_per_iter: 4
selfplay_lr: 0.0001
max_game_plies: 40
selfplay_workers: 1
selfplay_eval_every_iters: 1      # Elo vs random (and vs the previous iteration without a gate) every N iterations
selfplay_gate_games: 2            # gate match (candidate vs best with superfly) kept tiny; the other v2 keys use the defaults
selfplay_gate_sims: 4
