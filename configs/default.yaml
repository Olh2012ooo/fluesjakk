# fly-chess default training config: the whole FlyWire brain, one epoch of imitation over the
# Lichess 2014 shards, then self-play. Mirrors flychess.train.config.TrainConfig (all keys optional).
#   fly train --run fly1 --config configs/default.yaml
run: fly1
graph: full                    # data/brain/full.npz (134k neurons, 2.7M synapses)
brain:
  steps: 8                     # recurrent timesteps per position
  alpha: 0.5                   # initial leak, learned per neuron
  activation: relu
  input_dim: 1280
  num_moves: 4168
  weight_init_scale: 1.0
  dale: true                   # synapse signs fixed by the presynaptic neurotransmitter
  dtype: float32
  value_hidden: 256

# ---- data ----
shards_dir: data/shards        # relative path: the cwd if it exists there, else FLYCHESS_HOME
shard_name: null               # any shard in shards_dir (`fly build-shards --name X` + `shard_name: X` to filter)
val_fraction: 0.02

# ---- imitation (stage 1) ----
batch_size: 256
lr: 0.001                      # AdamW, linear warm-up then cosine decay to 10 %
weight_decay: 0.0001
warmup_steps: 500
epochs: 1
max_steps: null                # optional absolute step cap
value_loss_weight: 1.0
grad_clip: 1.0
amp: false                     # keep fp32: bf16 autocast on the dense parts corrupts the loss once recurrent activity grows (measured: -8 pts top-1)
grad_checkpoint: false         # recompute recurrent steps in backward (halves activation memory)

# ---- logging / evaluation ----
log_every: 20
eval_every: 1000
eval_batches: 50
checkpoint_every: 2000
elo_every: 5000                # quick Elo vs random / material every N steps (0 = off)
elo_games: 20
num_workers: 2                 # DataLoader workers: one has ~85x headroom at full-brain speed, each costs ~0.9 GB RAM
seed: 0
device: cuda

# ---- self-play (stage 2) ----
selfplay_iters: 50
selfplay_games_per_iter: 512   # v2: games per iteration, always generated by the best network (v1: 64)
mcts_sims: 100                 # simulations per move in self-play (v1: 64)
c_puct: 1.5
temperature_plies: 30
dirichlet_alpha: 0.3
dirichlet_eps: 0.25
replay_buffer_size: 200000
selfplay_batch_size: 384
selfplay_train_steps_per_iter: 400
selfplay_lr: 0.0001            # v1's 2e-4 on self-play targets alone forgot the human data
max_game_plies: 300
selfplay_workers: 1
selfplay_lockstep_games: 512   # games searched in one lockstep batch; more games run as several batches
selfplay_eval_every_iters: 5      # Elo vs random (and vs the previous iteration without a gate) every N iterations
selfplay_human_mix: 0.5           # half of every training batch streams from the imitation shards (rehearsal)
selfplay_value_blend: 0.5         # value target = 0.5 * game outcome + 0.5 * root search value
selfplay_gate: true               # promote the candidate only if it beats the best network with superfly
selfplay_gate_games: 40           # gate match games (paired distinct openings, both colours)
selfplay_gate_sims: 100           # MCTS simulations per move in the gate match
selfplay_gate_threshold: 0.55     # promote iff the candidate's score fraction >= threshold
