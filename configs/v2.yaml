# fly-chess v2 recipe: deeper dynamics, bounded firing rates, 4x the data, fp32, step-capped schedule.
#   scripts/train-supervised.sh fly2 --stage imitation --config configs/v2.yaml
run: fly2
graph: full
brain:
  steps: 16                    # 16 synaptic hops from the sensory neurons to the descending neurons (v1: 8)
  alpha: 0.5
  activation: satrelu          # sat * tanh(relu(x) / sat): rates saturate instead of drifting upward
  sat: 10.0
  input_dim: 1280
  num_moves: 4168
  weight_init_scale: 1.0
  dale: true
  dtype: float32
  value_hidden: 256

shards_dir: data/shards
shard_name: null               # lichess2014 + lichess2015 (229M positions, game-disjoint val series)
val_fraction: 0.02

batch_size: 384                # 16 steps x 384 fits the 16 GB card without gradient checkpointing
lr: 0.0006
weight_decay: 0.0001
warmup_steps: 1500
epochs: 1
max_steps: 280000              # ~108M positions (~47 % of the data), ~24 h on an RTX 5080
value_loss_weight: 1.0
grad_clip: 1.0
amp: false                     # bf16 autocast corrupts the loss as activity grows (measured on v1)
grad_checkpoint: false

log_every: 20
eval_every: 2000
eval_batches: 50
checkpoint_every: 4000
elo_every: 20000
elo_games: 20
num_workers: 12
seed: 1
device: cuda

selfplay_iters: 50
selfplay_games_per_iter: 64
mcts_sims: 64
c_puct: 1.5
temperature_plies: 30
dirichlet_alpha: 0.3
dirichlet_eps: 0.25
replay_buffer_size: 200000
selfplay_batch_size: 256
selfplay_train_steps_per_iter: 200
selfplay_lr: 0.0002
max_game_plies: 300
selfplay_workers: 1
selfplay_eval_every_iters: 5
