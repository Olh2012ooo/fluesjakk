[project]
name = "flychess"
version = "1.0.0"
description = "Fluesjakk: sjakk mot et nevralt nettverk koblet som hjernen til en fruktflue (FlyWire-connectomet)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Oliver Lysø Hellevik" }]
# Motoren og treningskoden er arvet fra fly-chess av Carlo Esposito (MIT).
# Se CREDITS.md for hva som er arvet og hva som er nytt.
maintainers = [{ name = "Oliver Lysø Hellevik" }]
dependencies = [
  "torch>=2.7",  # CUDA 12.8+ hjul: trengs for Blackwell (sm_120)-kort
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyarrow>=17",
  "chess>=1.11",
  "zstandard>=0.23",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "requests>=2.32",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "rich>=13",
]

[project.scripts]
fly = "flychess.cli:main"
fluesjakk = "flychess.cli:main"   # samme verktøy under prosjektets eget navn

# PEP 735-avhengighetsgruppe: `uv sync` installerer den som standard; med pip bruker du
# `pip install --group dev` (pip >= 25.1).
[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flychess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = ["slow: trenger ekte data eller GPU; kjør med -m slow"]

[tool.ruff]
line-length = 110
target-version = "py312"
