[project]
name = "flychess"
version = "0.1.0"
description = "A chess-playing neural network wired exactly like a fruit fly brain (FlyWire connectome)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Carlo Esposito", email = "carlo@aploi.de" }]
dependencies = [
  "torch>=2.7",  # CUDA 12.8+ wheels: needed for Blackwell (sm_120) GPUs
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyarrow>=17",
  "chess>=1.11",
  "zstandard>=0.23",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "requests>=2.32",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "rich>=13",
]

[project.scripts]
fly = "flychess.cli:main"

# PEP 735 dependency group: `uv sync` installs it by default; with pip use `pip install --group dev` (pip >= 25.1).
[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flychess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = ["slow: needs real data or GPU; run with -m slow"]

[tool.ruff]
line-length = 110
target-version = "py312"
